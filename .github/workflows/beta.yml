name: Beta build

# Builds a closed-beta release: the API image (GHCR), an Android App Bundle and an iOS compile check.
# Run it from the Actions tab or push a tag like beta-2026.11.13.
# Configuration lives in repository variables (vars.*) and secrets; see docs/beta.md. Nothing secret is in this file.

on:
  workflow_dispatch:
  push:
    tags: ['beta-*']

permissions:
  contents: read

jobs:
  api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          docker build -f backend/Dockerfile -t "$image:beta-${GITHUB_RUN_NUMBER}" -t "$image:beta" .
          docker push "$image:beta-${GITHUB_RUN_NUMBER}"
          docker push "$image:beta"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test
      - name: Build app bundle
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=HALLY_ENV=beta
          --dart-define=HALLY_DEV_SIGN_IN=false
          --dart-define=HALLY_API_URL=${{ vars.BETA_API_URL }}
          --dart-define=HALLY_GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN_MOBILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: hally-android-beta-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal testing
        if: env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.hally
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    # Compile check without signing. TestFlight upload needs an Apple Developer account: see docs/beta.md.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=HALLY_ENV=beta
          --dart-define=HALLY_DEV_SIGN_IN=false
          --dart-define=HALLY_API_URL=${{ vars.BETA_API_URL }}
          --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN_MOBILE }}
