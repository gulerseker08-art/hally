services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hally
      POSTGRES_USER: ${POSTGRES_USER:-hally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hally} -d hally"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Hally: Host=postgres;Database=hally;Username=${POSTGRES_USER:-hally};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ExternalAuth__GoogleClientIds__0: ${GOOGLE_CLIENT_ID:-}
      ExternalAuth__AppleAudiences__0: ${APPLE_AUDIENCE:-}
      ExternalAuth__EnableDevProvider: ${ENABLE_DEV_SIGN_IN:-true}
      Database__MigrateOnStartup: "true"
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__VisionModel: ${AI_VISION_MODEL:-}
      Ai__ChatModel: ${AI_CHAT_MODEL:-}
      Storage__Root: /data/documents
      Push__FcmProjectId: ${FCM_PROJECT_ID:-}
      Push__FcmServiceAccountJson: ${FCM_SERVICE_ACCOUNT_JSON:-}
      Billing__SandboxPurchases: ${BILLING_SANDBOX:-false}
      Privacy__AiProviderNoTraining: ${PRIVACY_AI_NO_TRAINING:-false}
      Sentry__Dsn: ${SENTRY_DSN:-}
      Admin__ApiKey: ${ADMIN_API_KEY:-}
      Privacy__AiProviderName: ${PRIVACY_AI_PROVIDER_NAME:-}
      Privacy__ContactEmail: ${PRIVACY_CONTACT_EMAIL:-}
      Privacy__PolicyUrl: ${PRIVACY_POLICY_URL:-}
      Billing__Apple__BundleId: ${APPLE_BUNDLE_ID:-}
      Billing__Apple__IssuerId: ${APPLE_IAP_ISSUER_ID:-}
      Billing__Apple__KeyId: ${APPLE_IAP_KEY_ID:-}
      Billing__Apple__PrivateKey: ${APPLE_IAP_PRIVATE_KEY:-}
      Billing__Apple__Environment: ${APPLE_IAP_ENVIRONMENT:-Production}
      Billing__Google__PackageName: ${GOOGLE_PLAY_PACKAGE_NAME:-}
      Billing__Google__ServiceAccountJson: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      Billing__Google__NotificationToken: ${GOOGLE_PLAY_NOTIFICATION_TOKEN:-}
      Storage__EncryptionKey: ${STORAGE_ENCRYPTION_KEY:?set STORAGE_ENCRYPTION_KEY in .env}
    ports: ["8080:8080"]
    volumes: [documents:/data/documents]
    # Readiness: GET http://localhost:8080/health/ready (checks PostgreSQL)

volumes:
  pgdata:
  documents:
